<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Sparrk</title>
<style>
body{margin:0;background:#07111f;color:#eef4ff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:20px 16px}.logo{font-size:26px;font-weight:900}.logo b{color:#ffd43b}.card{background:#0d1b2d;border:1px solid #26384f;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stat{font-size:32px;color:#ffd43b;font-weight:900}.muted{color:#9fb0c5}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.p{background:#ffd43b}.d{background:#17283d;color:white}.danger{background:#ef4444;color:white}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;background:#091727;color:white;border:1px solid #334963;border-radius:9px;box-sizing:border-box}.option{display:block;width:100%;text-align:left;background:#14263b;color:white;margin:8px 0}.sel{outline:2px solid #ffd43b}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #26384f;text-align:left}
</style></head><body><div class=wrap><div class=logo>SKY <b>SPARRK</b></div><div id=app></div></div>
<script>
let T=localStorage.token||"",U=JSON.parse(localStorage.user||"null"),test,ans=[],qi=0,timer;
const app=document.getElementById("app");
async function api(u,o={}){o.headers={...(o.headers||{}),...(T?{Authorization:"Bearer "+T}:{})};if(o.body)o.headers["Content-Type"]="application/json";let r=await fetch(u,o),x=await r.json();if(!r.ok)throw Error(x.error||"Error");return x}
function home(){app.innerHTML=`<div class=card><h1>Prepare. Practice. Perform.</h1><p class=muted>Sky Sparrk Mock Test Platform</p><button class=p onclick=login()>Student Login / Signup</button></div>`}
function login(){app.innerHTML=`<div class=card><h2>Student Login</h2><input id=e placeholder=Email><input id=p type=password placeholder=Password><button class=p onclick=doLogin()>Login</button><hr><h3>Create Account</h3><input id=n placeholder=Name><input id=ne placeholder=Email><input id=np type=password placeholder=Password (6+ chars)><button class=d onclick=reg()>Register</button></div>`}
async function doLogin(){try{let x=await api("/api/login",{method:"POST",body:JSON.stringify({email:e.value,password:p.value})});set(x);U.role==="admin"?admin():dash()}catch(x){alert(x.message)}}
async function reg(){try{let x=await api("/api/register",{method:"POST",body:JSON.stringify({name:n.value,email:ne.value,password:np.value})});set(x);dash()}catch(x){alert(x.message)}}
function set(x){T=x.token;U=x.user;localStorage.token=T;localStorage.user=JSON.stringify(U)}
async function dash(){let ts=await api("/api/tests"),h=await api("/api/history");app.innerHTML=`<div class=row><h2>Welcome, ${U.name}</h2><button class=d onclick=logout()>Logout</button></div><div class=grid><div class=card><div class=stat>${h.length}</div>Attempts</div><div class=card><div class=stat>${h.length?Math.round(h.reduce((a,x)=>a+x.accuracy,0)/h.length):0}%</div>Average Accuracy</div></div><h2>Mock Tests</h2><div class=grid>${ts.map(t=>`<div class=card><h3>${t.title}</h3><p class=muted>${t.time_minutes} minutes</p><button class=p onclick=start(${t.id})>Attempt</button></div>`).join("")}</div>`}
async function start(id){test=await api("/api/tests/"+id);ans=Array(test.questions.length).fill(null);qi=0;let s=test.time_minutes*60;app.innerHTML=`<div class=card><div class=row><b>${test.title}</b><b id=clock></b></div><h2 id=q></h2><div id=o></div><button class=d onclick=prev()>Previous</button> <button class=p onclick=next()>Next</button></div>`;render();clearInterval(timer);timer=setInterval(()=>{s--;clock.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=0)finish()},1000)}
function render(){let x=test.questions[qi];q.textContent=`Q${qi+1}/${test.questions.length}: ${x.q}`;o.innerHTML=["a","b","c","d"].map((k,i)=>`<button class="option ${ans[qi]===i?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${x[k]}</button>`).join("")}
function pick(i){ans[qi]=i;render()}function prev(){if(qi)qi--,render()}function next(){if(qi<test.questions.length-1)qi++,render();else if(confirm("Submit test?"))finish()}
async function finish(){clearInterval(timer);let r=await api("/api/attempts",{method:"POST",body:JSON.stringify({testId:test.id,answers:ans})});app.innerHTML=`<div class=card><h1>Result</h1><div class=stat>${r.score}/${r.total}</div><p>Accuracy: ${r.accuracy}%</p><button class=p onclick=dash()>Dashboard</button></div>`}
async function admin(){let s=await api("/api/admin/stats"),ts=await api("/api/admin/tests");app.innerHTML=`<div class=row><h2>Admin Dashboard</h2><button class=d onclick=logout()>Logout</button></div><div class=grid><div class=card><div class=stat>${s.students}</div>Students</div><div class=card><div class=stat>${s.tests}</div>Tests</div><div class=card><div class=stat>${s.questions}</div>Questions</div><div class=card><div class=stat>${s.attempts}</div>Attempts</div></div><div class=grid><div class=card><h2>Create Test</h2><input id=tt placeholder=Title><input id=tm type=number value=10><button class=p onclick=createTest()>Create</button></div><div class=card><h2>Add Question</h2><select id=ts>${ts.map(t=>`<option value=${t.id}>${t.title}</option>`).join("")}</select><input id=sub placeholder=Subject><textarea id=qq placeholder=Question></textarea><input id=oa placeholder=Option A><input id=ob placeholder=Option B><input id=oc placeholder=Option C><input id=od placeholder=Option D><select id=ca><option value=0>Correct A</option><option value=1>Correct B</option><option value=2>Correct C</option><option value=3>Correct D</option></select><input id=ex placeholder=Explanation><button class=p onclick=addQ()>Add Question</button></div></div><div class=card><h2>Tests</h2>${ts.map(t=>`<p><b>${t.title}</b> — ${t.question_count} questions — ${t.published?"Published":"Draft"} <button class=${t.published?"danger":"p"} onclick="pub(${t.id},${t.published})">${t.published?"Unpublish":"Publish"}</button></p>`).join("")}</div>`}
async function createTest(){await api("/api/admin/tests",{method:"POST",body:JSON.stringify({title:tt.value,time_minutes:+tm.value||10})});admin()}
async function addQ(){await api("/api/admin/questions",{method:"POST",body:JSON.stringify({test_id:+ts.value,subject:sub.value,q:qq.value,a:oa.value,b:ob.value,c:oc.value,d:od.value,correct:+ca.value,explanation:ex.value})});alert("Question added");admin()}
async function pub(id,p){await api("/api/admin/tests/"+id,{method:"PATCH",body:JSON.stringify({published:!p})});admin()}
function logout(){localStorage.clear();T="";U=null;home()}
if(U)U.role==="admin"?admin():dash();else home();
</script></body></html>
